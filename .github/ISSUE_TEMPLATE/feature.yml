name: Idea
description: Something Cabinet should do that it does not do yet
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "An open-ended idea or a question fits better in Discussions. Check the roadmap (ROADMAP.md) first: it may already be planned."
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
      description: What you were trying to do, and what got in the way
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you work around it today
