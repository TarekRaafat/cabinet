# Publishes the package to npm, with provenance, when the maintainer publishes a GitHub release.
# Nothing else starts it. The release's tag must match the version in package.json.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # signs the provenance, and signs in to npm as a trusted publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the history and its release tags, so the tests can tell released versions
          persist-credentials: false   # no token left on disk while the tests run
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tools the tests use that the runner lacks (as in test/linux/Dockerfile)
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@12.2.1
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Test
        run: npm test
      - name: Publish with provenance
        run: npm publish --provenance --access public
