# Runs the tests on every push to main, and on a manual run, on the same runner the release workflow uses,
# so a failure there shows before a release. It only reads the repository: it never publishes.
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the history and its release tags, so the tests can tell released versions
          persist-credentials: false   # no token left on disk while the tests run
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org   # the .npmrc the release run has; no token is given
      - name: The tools the tests use that the runner lacks (as in test/linux/Dockerfile)
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: The npm the release workflow uses
        run: npm install -g npm@12.2.1
      - name: Test
        run: npm test
