# Builds the website (site/build.js) and publishes it to GitHub Pages, when the maintainer publishes a
# GitHub release (built from its tag) or starts a run by hand for a fix. Nothing else starts it, and every
# run deploys only after the maintainer approves it in the repo's github-pages environment.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no token left on disk while the site builds
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the site
        env:
          REF: ${{ github.ref_name }}   # the release tag, or the branch of a manual run
        run: node site/build.js _site --ref "$REF"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # prove the deploy comes from this workflow
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
