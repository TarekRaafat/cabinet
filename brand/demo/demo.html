<script>
var END = 96000, MIST = "#E8EAEE", BRASS = "#D7A54B", NS = "http://www.w3.org/2000/svg";

function $(id) { return document.getElementById(id); }
function pos(k, r) { var a = k * Math.PI / 4; return [r * Math.cos(a), -r * Math.sin(a)]; }
function svgEl(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var a in attrs) e.setAttribute(a, attrs[a]); parent.appendChild(e); return e; }

}
// The logo animation from time a: the owner in the middle, the seats fan out, the owner moves home.
function logo(m, t, a) {
  for (var k = 1; k < 8; k++) {
    var f = out(ramp(t, a + 800 + 45 * Math.abs(k - 4), 900)), p = pos(k, 36);
    m.seats[k].setAttribute("cx", (p[0] * f).toFixed(3)); m.seats[k].setAttribute("cy", (p[1] * f).toFixed(3));

var imark = makeMark($("imark")), lmark = makeMark($("lmark"));

var C = CAPTURED, seat = '<span class="seat">\u2B24</span>';
var PROGS = { cabinet: 1, git: 1, cd: 1, npm: 1 };
function escH(x) { return x.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
// A command line, possibly typed only in part: the program, its verb, flags, quoted text.
function hlCmd(text) {
  var out = "", seen = 0, verbs = 0;
  (text.match(/"[^"]*"?|'[^']*'?|\S+|\s+/g) || []).forEach(function (tok) {
    var e = escH(tok);
    if (/^\s+$/.test(tok)) out += e;
    else if (!seen++ && Object.keys(PROGS).some(function (p) { return p.indexOf(tok) === 0; })) out += '<span class="prog">' + e + "</span>";
    else if (/^--?[a-z]/.test(tok)) { verbs = 9; out += '<span class="flag">' + e + "</span>"; }
    else if (/^["']/.test(tok)) out += '<span class="str">' + e + "</span>";
    else if (verbs++ < 2 && /^[a-z][a-z-]*$/.test(tok)) out += '<span class="verb">' + e + "</span>";
    else out += e;
  });
  return out;
}
// An output line, already HTML: section headings, "Run: <command>", role states, placed and added.
function hlOut(l) {
  var m;
  // A line the capture already colored is shown as it is.
  if (/<span class="/.test(l)) return l;
  if ((m = l.match(/^== (.*)$/))) return '<span class="d">== </span><span class="hd">' + m[1] + "</span>";
  if ((m = l.match(/^(.*Run: )(.*)$/))) return m[1] + hlCmd(m[2].replace(/&lt;/g, "<").replace(/&gt;/g, ">"));
  if ((m = l.match(/^(\S+)(\s+)(kit|optional)(\s+)(on|off)$/))) return '<span class="verb">' + m[1] + "</span>" + m[2] + '<span class="d">' + m[3] + "</span>" + m[4] + (m[5] === "on" ? '<span class="on">on</span>' : '<span class="d">off</span>');
  if ((m = l.match(/^(\s+)(placed|added|installed|added or reordered)( .*)$/))) return m[1] + '<span class="d">' + m[2] + "</span>" + m[3];
  if ((m = l.match(/^(Next|Updates|Created)(.*)$/))) return '<span class="verb">' + m[1] + "</span>" + m[2];

}
["01-new", "03-roles", "04-next", "05-bootstrap", "06-doctor", "08-handoff", "09-handoffs"].forEach(function (k) { C[k].lines = C[k].lines.map(hlOut); });
C["07-version"].lines = C["07-version"].lines.map(function (l) { return l.replace(/⬤/g, seat); });
// cabinet version ends with a blank line; the capture trimmed it.
C["07-version"].lines.push("");
function opts(l) { return l.replace(/\b([AB]):/g, '<span class="opt">$1:</span>'); }
var BRIEF = [
  "Today: 3 decisions, 1 action, about 5 min.",
  "",
  "<h>## Sign-off queue</h>",
  "1. Spend $40 on search ads for launch week, starting Sunday?",
  "   A: yes, $40.   B: no ads this month.",
  "   Finance: A, inside the budget. Product manager: A, launch week.",
  "   <span class=\"b\">Recommended: A.</span> Undo: no, the money is spent.",
  "2. Publish the 1.2 release notes today?",
  "   A: today.   B: after the checkout fix lands tomorrow.",
  "   <span class=\"b\">Recommended: B,</span> the notes describe the fix. Undo: no.",
  "3. Merge the checkout redesign? qa and security passed. Evidence: the checkout page.",
  "   A: merge.   B: hold.   Design lead: A.",
  "   <span class=\"b\">Recommended: A.</span> Undo: yes.",
  "",
  "<h>## Actions for the owner</h>",
  "Push web, main at 8a71d04: the checkout redesign, ready to push."
].map(function (l) { return opts(l).replace(/^(\d\.)/, '<span class="verb">$1</span>').replace(/^Today:/, '<span class="verb">Today:</span>'); });
var REPLY = [
  '<span class="p">you</span>  approve 1 and 3; 2: no',
  "",
  '<span class="hd">chief-of-staff</span>',
  "Applied. 1: $40 on search ads, approved; the finance note is updated.",
  "2: the release notes wait for the checkout fix; the handoff says so.",
  "3: approved. Ready for you: push web, main at 8a71d04.",
  "Committed: handoffs: apply the owner's answers of 22 Oct 2026."
];
var PUSH = [
  "", "Push to git@github.com:acme/web.git",
  "refs/heads/main 8a71d04e2c9b6f3d1a5e7c0b4f8d2a6e9c3b1f57 refs/heads/main 3f2c9e1b7a4d8c6e0f2b5a9d3c7e1f4b8a6d2c09",
  "Type yes to push: "
];
// What git prints once the owner types yes.
var PUSHED = ["To github.com:acme/web.git", "   3f2c9e1..8a71d04  main -> main"];

// The chapters: a window, a caption, and steps that type a command or show lines.
var CH = [
  { a: 5000, z: 17000, chap: "1  Create the team", title: "~", cap: "One command makes the workspace.", sub: "Seven roles on by default, with their rules and files. Any seat your project needs can be added.",
    steps: [{ at: 5800, cmd: C["01-new"].cmd, out: C["01-new"].lines, rate: 70 }, { at: 10200, cmd: "cd acme", out: [], rate: 0, prompt: "~", after: "~/acme" }, { at: 11000, cmd: C["03-roles"].cmd, out: C["03-roles"].lines, rate: 70 }] },
  { a: 17000, z: 31000, chap: "2  Set up the machine", title: "~/acme", cap: "Guardrails for every agent tool.", sub: "And the morning brief on a schedule. cabinet next always says what is left.",
    steps: [{ at: 17600, cmd: C["04-next"].cmd, out: C["04-next"].lines, rate: 90 }, { at: 22000, cmd: C["05-bootstrap"].cmd, out: C["05-bootstrap"].lines, rate: 60 }] },
  { a: 31000, z: 41000, chap: "3  Check everything", title: "~/acme", cap: "The doctor checks everything.", sub: "Repos, roles, guardrails, schedules, secrets, spend. Each problem comes with its fix.",
    steps: [{ at: 31600, cmd: C["06-doctor"].cmd, out: C["06-doctor"].lines, rate: 70 }] },
  { a: 41000, z: 56000, chap: "4  Your morning brief", title: "BRIEF.md", tag: "written by the chief-of-staff agent, 7:00 AM", cap: "Every decision only you can make.", sub: "In one brief: plain questions, options, the experts' advice, and whether it can be undone.",
    steps: [{ at: 41700, out: BRIEF, rate: 260, file: true }] },
  { a: 56000, z: 64000, chap: "5  Answer in one line", title: "agent session", tag: "the agent's reply", cap: "Answer in one line.", sub: "The agents apply it to the specs and handoffs, and commit.",
    steps: [{ at: 56600, chat: "approve 1 and 3; 2: no", out: REPLY.slice(1), rate: 260 }] },
  { a: 64000, z: 76000, chap: "6  The team at work", title: "~/acme", cap: "Agents hand work to each other.", sub: "Every handoff has one owner, and the agent that built it never verifies it.",
    steps: [{ at: 64600, cmd: 'cabinet handoff add --from design-lead --to qa --changed "Checkout screens: cart, address, payment" --needed "Verify against the spec\'s acceptance criteria" "Checkout screens ready"', out: C["08-handoff"].lines, rate: 80, fast: true }, { at: 68600, cmd: C["09-handoffs"].cmd, out: C["09-handoffs"].lines, rate: 80 }] },
  { a: 76000, z: 84000, chap: "7  Only you push", title: "~/acme/web", cap: "No agent can push, merge or publish.", sub: "You push, from your own terminal, when the reviews have passed.",
    steps: [{ at: 76600, cmd: "git push", out: PUSH, rate: 120, prompt: "~/acme/web", typed: { text: "yes", at: 79600, then: PUSHED } }] },
  { a: 84000, z: 89000, chap: "", title: "~/acme", cap: "", sub: "",
    cells: true, steps: [{ at: 84500, cmd: C["07-version"].cmd, out: C["07-version"].lines, rate: 60 }] }
];

// Cut to the music (Clean Final Chord (1), about 110 BPM, 94.4 s): the intro over the guitar alone; chapter 1
// when the drums come in (8.95 s); each chapter's card before it; cabinet version on the late entrance (83.75 s);
// the logo animation on the final section (88.15 s); the name as the last chord rings out.
var CARD = 1600, LENS = [10200, 11000, 8400, 12000, 7400, 8800, 7400], SEGS = [{ kind: "intro", a: 0, z: 7350, shift: 0 }];
END = 94400;
(function () {
  var at = 8950;
  for (var i = 0; i < LENS.length; i++) {
    CH[i].z = CH[i].a + LENS[i];
    SEGS.push({ kind: "card", a: at - CARD, z: at, ch: CH[i] });
    SEGS.push({ kind: "ch", a: at, z: at + LENS[i], shift: CH[i].a - at });
    at += LENS[i] + CARD;
  }
  SEGS[SEGS.length - 1].z = 83750;
  SEGS.push({ kind: "ch", a: 83750, z: 87550, shift: 84000 - 83750 });
  SEGS.push({ kind: "end", a: 87550, z: END + 1, shift: 89000 - 87550 });
})();
// Film time to the chapters' own time, and which part of the film it is.
function timeline(film) {
  for (var i = 0; i < SEGS.length; i++) {
    var g = SEGS[i];
    if (film < g.z) return g.kind === "card" ? { t: -1, card: g.ch, into: film - g.a, kind: "card" } : { t: film + g.shift, card: null, kind: g.kind };
  }
  return { t: film, card: null, kind: "end" };
}
var t0 = 0;
function show(id, a, z, rise) {
  var e = out(ramp(t0, a, 700)), x = 1 - inout(ramp(t0, z, 400)), el = $(id);
  el.style.opacity = (e * x).toFixed(3);
  el.style.transform = "translateY(" + ((1 - e) * (rise == null ? 24 : rise)).toFixed(1) + "px)";
}
// A chapter's screen at time t: each step types its command (a key every 38 ms, faster for long ones), waits, then prints its lines.
function screen(ch, t) {

  ch.steps.forEach(function (s) {
    if (t < s.at) return;
    var prompt = '<span class="p">' + (s.prompt || cwd) + " $</span> ";
    if (s.file) { lines = lines.concat(s.out.slice(0, Math.floor((t - s.at) / s.rate) + 1)); return; }
    var text = s.cmd || s.chat, key = s.fast ? 14 : 38, typedN = Math.min(text.length, Math.floor((t - s.at) / key)), done = s.at + text.length * key;
    if (s.chat) prompt = '<span class="p">you</span>  ';

    var n = s.rate ? Math.min(s.out.length, Math.floor((t - done - 350) / s.rate) + 1) : 0;

      if (s.typed.then && t > s.typed.at + 700) shown = shown.concat(s.typed.then.slice(0, Math.floor((t - s.typed.at - 700) / 250) + 1));

    lines = lines.concat(shown);
    if (s.after) cwd = s.after;
    var finished = n === s.out.length && (!s.typed || t > s.typed.at + 700 + 250 * ((s.typed.then || []).length));
    if (finished && !s.chat) lines.push('<span class="p">' + cwd + " $</span> ");

    if (s.typed && n === s.out.length && !finished) caret = true;

function render(film) {

  show("ititle", 2400, 6500); show("isub", 2800, 6500, 16);
  t0 = t;

  var ch = null; if (tl.kind === "ch") CH.forEach(function (c) { if (t >= c.a && t < c.z) ch = c; });

    ct.style.opacity = (out(ramp(into, 150, 550)) * fadeOut).toFixed(3); ct.style.transform = "translateY(" + ((1 - out(ramp(into, 150, 550))) * 24).toFixed(1) + "px)";
    ch = null;
  } else { cn.style.opacity = 0; ct.style.opacity = 0; }
  var win = $("win"), winOp = tl.kind === "ch" ? 1 : tl.kind === "end" ? 1 - inout(ramp(t, 89000, 600)) : 0;

    var sc = $("screen"); sc.style.lineHeight = ch.cells ? "30px" : ""; sc.innerHTML = screen(ch, t); sc.scrollTop = sc.scrollHeight;
    $("screen").style.opacity = (fadeIn * fadeOut).toFixed(3);
    $("wtitle").textContent = ch.title; $("wtag").textContent = ch.tag || ""; $("wtag").style.display = ch.tag ? "" : "none";
    $("chap").textContent = ch.chap; $("cap").textContent = ch.cap; $("capsub").textContent = ch.sub;
    show("chap", ch.a + 200, ch.z - 300, 8); show("cap", ch.a + 600, ch.z - 400); show("capsub", ch.a + 1000, ch.z - 400, 14);
  } else { $("screen").innerHTML = ""; $("chap").style.opacity = 0; $("cap").style.opacity = 0; $("capsub").style.opacity = 0; }

  var lk = $("lockup"), name = $("lname"), gap = 0.32 * 200, room = inout(ramp(t, 92300, 700));
  lk.style.opacity = t >= 89600 ? 1 : 0;
  lk.style.transform = "translateX(" + ((name.offsetWidth + gap) / 2 * (1 - room)).toFixed(1) + "px)";
  logo(lmark, t, 89600);
  lmark.owner.setAttribute("opacity", (out(ramp(t, 89600, 300)) * (1 - inout(ramp(t, 92100, 400)))).toFixed(3));
  name.style.opacity = inout(ramp(t, 92500, 500)).toFixed(3);
  show("end1", 93300, 999999, 14); show("end2", 93800, 999999, 10);

function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); $("stage").style.transform = "scale(" + s + ")"; }
if (location.hash !== "#capture") {

  var start = null, paused = false, at = 0;
  addEventListener("keydown", function (e) {

} else { $("ui").style.display = "none"; render(0); }
</script>
