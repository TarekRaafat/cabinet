<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" width="96" height="96" role="img" aria-label="cabinet">
  <!-- On its own light tile, so it reads the same on light and dark pages. -->
  <rect x="-50" y="-50" width="100" height="100" rx="22" fill="#f3f4f6"/>
  <!-- Seven seats around a table; the eighth place, at the right, is left open for the owner. -->
  <g transform="scale(0.66)" fill="#15181e">
    <circle cx="25.456" cy="-25.456" r="9.5"/>
    <circle cx="0" cy="-36" r="9.5"/>
    <circle cx="-25.456" cy="-25.456" r="9.5"/>
    <circle cx="-36" cy="0" r="9.5"/>
    <circle cx="-25.456" cy="25.456" r="9.5"/>
    <circle cx="0" cy="36" r="9.5"/>
    <circle cx="25.456" cy="25.456" r="9.5"/>
  </g>
</svg>
